[project]
name = "test-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prem Kumar", email = "pkumar@over-haul.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "bcrypt==4.0.1",
    "fastapi>=0.141.1",
    "mypy>=2.3.1",
    "passlib>=1.7.4",
    "psycopg2>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "python-jose>=3.5.0",
    "reportlab>=5.0.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
test-project = "test_project:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
